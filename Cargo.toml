[package]
name = "zhsmonitor-sys-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio"] }
sysinfo = "0.38.2"
tokio = { version = "1.49.0", features = ["full"] }
